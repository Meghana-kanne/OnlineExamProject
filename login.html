
<!DOCTYPE html>
<html>
<head>
    <title>Student Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightyellow;
            padding-top: 80px;
        }

        .login-box {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Student Login</h1>

        <form>
            <input type="text"
                   placeholder="Enter Username" required>

            <input type="password"
                   placeholder="Enter Password" required>

            <br><br>

            <button type="submit">Login</button>
        </form>

        <br>

        <a href="index.html">Back to Welcome Page</a>

    </div>

</body>
</html>
